<!DOCTYPE html>
<html lang="th" data-mode="auto">
<head>
  <base target="_top">
  <title>Ven. Ponnyar Nonda</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Kanit:wght@400;600&family=Prompt:wght@400;600&family=Noto+Sans+Thai:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@400;600&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --accent:#c8952f;
      --ink:#221a10; --muted:#6b6152; --line:#e8e0d2;
      --bg:#faf7f1; --card:#ffffff;
      --radius:14px;
      --font:'Sarabun','Noto Sans Thai','Noto Sans Myanmar','Segoe UI',Tahoma,sans-serif;
      --cover-h:220px; --cover-op:.55;
      --shadow:0 1px 2px rgba(34,26,16,.06), 0 8px 24px rgba(34,26,16,.06);
    }
    :root[data-mode="dark"]{
      --ink:#f2ece1; --muted:#a99f8f; --line:#332c22;
      --bg:#15120d; --card:#1d1811;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
    @media (prefers-color-scheme: dark){
      :root[data-mode="auto"]{
        --ink:#f2ece1; --muted:#a99f8f; --line:#332c22;
        --bg:#15120d; --card:#1d1811;
        --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      }
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{background:var(--bg); color:var(--ink); font-family:var(--font); line-height:1.65; -webkit-font-smoothing:antialiased}
    html[lang="mnw"] body{line-height:1.95}
    a{color:inherit}
    img{max-width:100%; display:block}
    .wrap{max-width:1040px; margin:0 auto; padding:0 16px 80px}

    /* ---------- header ---------- */
    .cover{position:relative; height:var(--cover-h); overflow:hidden; background:#2b2318}
    .cover img{width:100%; height:100%; object-fit:cover; opacity:var(--cover-op)}
    .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.15),var(--bg) 96%)}
    .topbar{position:absolute; top:14px; right:14px; z-index:3; display:flex; gap:8px; align-items:center}
    .langbar{display:flex; gap:6px; background:rgba(0,0,0,.35); padding:4px; border-radius:999px; backdrop-filter:blur(6px)}
    .langbar button{border:0; cursor:pointer; padding:6px 14px; border-radius:999px; font:inherit; font-size:13px; font-weight:600; color:#fff; background:transparent}
    .langbar button.on{background:var(--accent); color:#231a0c}
    .lockbtn{border:0; cursor:pointer; width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,.35); color:#fff; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px)}
    .lockbtn svg{width:17px;height:17px;stroke:currentColor}
    .lockbtn.on{background:var(--accent); color:#231a0c}

    .head{position:relative; margin-top:-84px; z-index:2; text-align:center}
    .avatar{width:150px;height:150px;border-radius:50%;margin:0 auto;object-fit:cover;border:5px solid var(--card); box-shadow:var(--shadow); background:var(--card)}
    h1{font-size:30px; margin:16px 0 4px; letter-spacing:.2px}
    .subname{color:var(--muted); font-size:15px; margin:0 0 10px}
    .position{max-width:720px; margin:0 auto; color:var(--muted); font-size:15px}
    .origin{max-width:720px; margin:8px auto 0; color:var(--muted); font-size:14px; font-style:italic}
    .badges{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:18px 0 6px}
    .badge{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:7px 14px; border-radius:999px; font-size:13px; font-weight:600; box-shadow:var(--shadow)}
    .badge svg{width:15px;height:15px;stroke:var(--accent)}

    /* ---------- tabs & cards ---------- */
    .tabs{display:flex; gap:4px; overflow-x:auto; margin:26px 0 20px; padding:5px; border:1px solid var(--line); background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow)}
    .tabs button{flex:1 0 auto; border:0; background:transparent; cursor:pointer; font:inherit; font-size:14px; font-weight:600; color:var(--muted); padding:10px 16px; border-radius:10px; white-space:nowrap}
    .tabs button.on{background:var(--accent); color:#231a0c}
    .grid{display:grid; gap:14px}
    .grid.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
    .grid.three{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
    .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow)}
    .card h3{margin:0 0 6px; font-size:16px; line-height:1.5}
    .card p{margin:0; color:var(--muted); font-size:14px}
    .card .sub{margin:0 0 8px; font-size:14px; color:var(--ink); opacity:.85}
    .chip{display:inline-block; font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; background:rgba(200,149,47,.16); background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent); margin-bottom:8px}
    .sectitle{font-size:13px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:26px 0 12px}
    .paper{display:flex; flex-direction:column; overflow:hidden; padding:0}
    .paper .thumb{height:150px; background:var(--line); overflow:hidden}
    .paper .thumb img{width:100%;height:100%;object-fit:cover}
    .paper .body{padding:16px}
    .paper .link{display:inline-block; margin-top:10px; font-size:13px; font-weight:700; color:var(--accent); text-decoration:none}
    table{width:100%; border-collapse:collapse; font-size:14px}
    th,td{text-align:left; padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top}
    th{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
    tbody tr:last-child td{border-bottom:0}
    .tablewrap{overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
    td.date{white-space:nowrap; color:var(--muted)}
    .tag{display:inline-block; font-size:12px; font-weight:700; padding:2px 9px; border-radius:999px; background:rgba(200,149,47,.16); background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent); white-space:nowrap}
    .contact{display:grid; gap:10px; font-size:14px}
    .contact div{display:flex; gap:10px; align-items:flex-start}
    .contact svg{width:17px;height:17px;stroke:var(--accent); flex:0 0 auto; margin-top:4px}
    .exp .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center; background:rgba(200,149,47,.16); background:color-mix(in srgb, var(--accent) 16%, transparent); margin-bottom:10px}
    .exp .ic svg{width:19px;height:19px;stroke:var(--accent)}
    footer{text-align:center; color:var(--muted); font-size:13px; margin-top:34px}
    .hide{display:none !important}

    /* ---------- modal / editor ---------- */
    .mask{position:fixed; inset:0; background:rgba(15,11,5,.55); backdrop-filter:blur(3px); z-index:50; display:flex; align-items:center; justify-content:center; padding:16px}
    .modal{background:var(--card); color:var(--ink); border-radius:16px; padding:24px; width:100%; max-width:360px; box-shadow:0 20px 60px rgba(0,0,0,.35)}
    .modal h2{margin:0 0 6px; font-size:19px}
    .modal p.hint{margin:0 0 16px; color:var(--muted); font-size:13px}
    .err{color:#c0392b; font-size:13px; margin:10px 0 0; min-height:18px}
    .btn{border:0; cursor:pointer; font:inherit; font-weight:700; font-size:14px; padding:10px 18px; border-radius:10px; background:var(--accent); color:#231a0c}
    .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--ink)}
    .btn.danger{background:#c0392b; color:#fff}
    .btn:disabled{opacity:.5; cursor:not-allowed}
    .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
    .row.end{justify-content:flex-end}

    input[type=text],input[type=password],input[type=number],textarea,select{
      width:100%; font:inherit; font-size:14px; padding:9px 12px; border-radius:9px;
      border:1px solid var(--line); background:var(--bg); color:var(--ink);
    }
    input[type=password].code{text-align:center; letter-spacing:.5em; font-size:20px; font-weight:700}
    textarea{resize:vertical; min-height:70px; line-height:1.6}
    input[type=color]{width:44px; height:36px; padding:2px; border:1px solid var(--line); border-radius:8px; background:var(--bg); cursor:pointer}
    label.fl{display:block; font-size:12px; font-weight:700; color:var(--muted); margin:0 0 5px; letter-spacing:.02em}

    .editor{position:fixed; inset:0; z-index:60; background:var(--bg); display:flex; flex-direction:column}
    .ed-top{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card); flex:0 0 auto}
    .ed-top strong{font-size:15px; margin-right:auto}
    .ed-body{flex:1 1 auto; display:flex; min-height:0}
    .ed-nav{flex:0 0 210px; border-right:1px solid var(--line); overflow-y:auto; padding:12px; background:var(--card)}
    .ed-nav button{display:block; width:100%; text-align:left; border:0; background:transparent; font:inherit; font-size:14px; color:var(--muted); padding:9px 12px; border-radius:9px; cursor:pointer}
    .ed-nav button.on{background:rgba(200,149,47,.18); background:color-mix(in srgb, var(--accent) 18%, transparent); color:var(--ink); font-weight:700}
    .ed-main{flex:1 1 auto; overflow-y:auto; padding:20px; max-width:1080px}
    .ed-main h2{margin:0 0 4px; font-size:20px}
    .ed-main .desc{margin:0 0 18px; color:var(--muted); font-size:13px}
    .fld{margin-bottom:14px}
    .fld.tri{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
    .lg{display:block; font-size:11px; color:var(--muted); margin:0 0 3px}
    .item{border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; background:var(--card)}
    .item-head{display:flex; align-items:center; gap:6px; margin-bottom:10px}
    .item-head span{font-weight:700; font-size:13px; color:var(--muted); margin-right:auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
    .ib{border:1px solid var(--line); background:var(--bg); color:var(--muted); cursor:pointer; width:28px; height:28px; border-radius:7px; font-size:13px; line-height:1; padding:0}
    .ib:hover{color:var(--ink)}
    .ib.del:hover{color:#c0392b; border-color:#c0392b}
    .thumbrow{display:flex; gap:10px; align-items:center; margin-top:8px}
    .thumbrow img{width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--line); background:var(--bg)}
    .peekbar{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:55; box-shadow:0 10px 30px rgba(0,0,0,.3); white-space:nowrap}
    .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1d1811; color:#fff; padding:11px 20px; border-radius:10px; font-size:14px; z-index:90; box-shadow:0 10px 30px rgba(0,0,0,.3)}
    .toast.err{background:#c0392b}
    .note{background:rgba(200,149,47,.10); background:color-mix(in srgb, var(--accent) 10%, transparent); border:1px solid rgba(200,149,47,.3); border-color:color-mix(in srgb, var(--accent) 30%, transparent); border-radius:10px; padding:12px 14px; font-size:13px; color:var(--ink); margin-bottom:16px}
    @media(max-width:760px){
      .ed-top{flex-wrap:wrap}
      .ed-top #dirtyFlag{order:9; flex:1 0 100%}
      .ed-body{flex-direction:column}
      .ed-nav{flex:0 0 auto; border-right:0; border-bottom:1px solid var(--line); display:flex; gap:6px; overflow-x:auto; padding:8px}
      .ed-nav button{width:auto; white-space:nowrap; padding:8px 12px}
      .fld.tri{grid-template-columns:1fr}
    }
    @media(max-width:520px){
      h1{font-size:24px}
      .avatar{width:122px;height:122px}
      .head{margin-top:-70px}
    }
    #lockbtn,#loginMask,#editor,#peekBar{display:none !important}
  </style>
</head>
<body>

<div class="cover">
  <img id="cover" alt="">
  <div class="topbar">
    <div class="langbar">
      <button id="btn-th" onclick="setLang('th')">ไทย</button>
      <button id="btn-en" onclick="setLang('en')">EN</button>
      <button id="btn-mon" onclick="setLang('mon')">မန်</button>
    </div>
    <button class="lockbtn" id="lockbtn" onclick="lockClick()" title="แก้ไขข้อมูล"></button>
  </div>
</div>

<div class="wrap">
  <div class="head">
    <img class="avatar" id="avatar" alt="">
    <h1 id="name"></h1>
    <p class="subname" id="subname"></p>
    <p class="position" id="position"></p>
    <p class="origin" id="origin"></p>
    <div class="badges" id="badges"></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="panel-about"></div>
  <div id="panel-work" class="hide"></div>
  <div id="panel-papers" class="hide"></div>
  <div id="panel-speeches" class="hide"></div>
  <footer id="footer"></footer>
</div>

<!-- กล่องใส่รหัส -->
<div class="mask hide" id="loginMask">
  <div class="modal">
    <h2>เข้าสู่โหมดแก้ไข</h2>
    <p class="hint">กรอกรหัสผ่านเพื่อแก้ไขข้อความ รูปภาพ และธีมสี</p>
    <input type="password" class="code" id="codeInput" inputmode="numeric" autocomplete="off"
           maxlength="24" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <p class="err" id="loginErr"></p>
    <div class="row end" style="margin-top:8px">
      <button class="btn ghost" onclick="closeLogin()">ยกเลิก</button>
      <button class="btn" id="loginBtn" onclick="doLogin()">เข้าสู่ระบบ</button>
    </div>
  </div>
</div>

<!-- หน้าจอแก้ไข -->
<div class="editor hide" id="editor">
  <div class="ed-top">
    <strong>โหมดแก้ไข</strong>
    <span id="dirtyFlag" style="color:var(--muted); font-size:13px"></span>
    <button class="btn ghost" onclick="closeEditor()">ปิด</button>
    <button class="btn ghost" onclick="peekPage()">ดูตัวอย่าง</button>
    <button class="btn" id="saveBtn" onclick="saveAll()">บันทึก</button>
  </div>
  <div class="ed-body">
    <div class="ed-nav" id="edNav"></div>
    <div class="ed-main" id="edMain"></div>
  </div>
</div>
<button class="btn peekbar hide" id="peekBar" onclick="backToEditor()">← กลับไปแก้ไข</button>

function t(v){
  if (v === null || v === undefined) return '';
  if (typeof v === 'string') return v;
  return v[LANG] || v.th || v.en || v.mon || '';
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function urlOf(raw){
  var s = String(raw || '').trim();
  var m = s.match(/\((https?:\/\/[^)]+)\)/);
  if (m) return m[1];
  return /^https?:\/\//i.test(s) ? s : '';
}
function getP(obj, path){
  var ps = path.split('.'), c = obj;
  for (var i = 0; i < ps.length; i++){
    if (c === null || c === undefined) return '';
    c = c[ps[i]];
  }
  return (c === null || c === undefined) ? '' : c;
}
function setP(obj, path, val){
  var ps = path.split('.'), c = obj;
  for (var i = 0; i < ps.length - 1; i++){
    if (c[ps[i]] === null || typeof c[ps[i]] !== 'object') c[ps[i]] = {};
    c = c[ps[i]];
  }
  c[ps[ps.length - 1]] = val;
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ============================================================
 *  THEME
 * ============================================================ */
var CUSTOM_KEYS = { bg:'--bg', card:'--card', ink:'--ink', muted:'--muted', line:'--line' };

function applyTheme(th){
  th = th || {};
  var root = document.documentElement, s = root.style;
  root.setAttribute('data-mode', th.mode || 'auto');

  if (th.accent) s.setProperty('--accent', th.accent);
  if (th.font)   s.setProperty('--font', "'" + th.font + "','Noto Sans Thai','Noto Sans Myanmar','Segoe UI',Tahoma,sans-serif");
  s.setProperty('--radius', (th.radius || 14) + 'px');
  s.setProperty('--cover-h', (th.coverHeight || 220) + 'px');
  s.setProperty('--cover-op', String(th.coverOpacity == null ? .55 : th.coverOpacity));

  for (var k in CUSTOM_KEYS){
    if (th.useCustom && th[k]) s.setProperty(CUSTOM_KEYS[k], th[k]);
    else s.removeProperty(CUSTOM_KEYS[k]);
  }
}

 *  VIEW

function renderView(){
  var P = DRAFT || PROFILE;
  document.documentElement.lang = (LANG === 'mon') ? 'mnw' : LANG;
  applyTheme(P.theme);

  var cover = document.getElementById('cover');
  var cu = urlOf(P.cover);
  if (cu){ cover.src = cu; cover.style.display = ''; } else { cover.removeAttribute('src'); cover.style.display = 'none'; }

  var av = document.getElementById('avatar');
  av.alt = t(P.name);
  av.onerror = function(){ this.onerror = null; this.src = NOPHOTO; };   // ลิงก์รูปเสีย/หมดอายุ

  document.title = t(P.name) + ' | ' + (P.nameEn || '');

  document.getElementById('badges').innerHTML = (P.badges || []).map(function(b){
    return '<span class="badge">' + icon(b.icon) + '<span>' + esc(t(b.text)) + '</span></span>';
  }).join('');

  LANGS.forEach(function(l){
    document.getElementById('btn-' + l.k).className = (LANG === l.k) ? 'on' : '';
  });

  lb.className = 'lockbtn' + (TOKEN ? ' on' : '');

    return '<button class="' + (TAB === k ? 'on' : '') + '" onclick="setTab(\'' + k + '\')">' + esc(u('tab_' + k)) + '</button>';
  }).join('');

  renderAbout(P); renderWork(P); renderPapers(P); renderSpeeches(P);
  ['about','work','papers','speeches'].forEach(function(k){
    document.getElementById('panel-' + k).className = (k === TAB) ? '' : 'hide';
  });

    '&copy; ' + new Date().getFullYear() + ' ' + esc(t(P.name)) + ' &middot; ' + esc(t((P.contact || {}).institution));

function renderAbout(P){
  var edu = (P.education || []).map(function(e){
    return '<div class="card"><span class="chip">' + esc(t(e.status)) + '</span>' +
      '<h3>' + esc(t(e.title)) + '</h3><p>' + esc(t(e.sub)) + '</p></div>';
  }).join('') || emptyCard();

  var exp = (P.expertise || []).map(function(x){
    return '<div class="card exp"><div class="ic">' + icon(x.icon) + '</div>' +
      '<h3>' + esc(t(x.title)) + '</h3><p>' + esc(t(x.desc)) + '</p></div>';
  }).join('') || emptyCard();

  var c = P.contact || {}, site = urlOf(c.website);

    '<div>' + icon('building') + '<span>' + esc(t(c.institution)) + '</span></div>' +
    (c.email ? '<div>' + icon('mail') + '<a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a></div>' : '') +
    (site ? '<div>' + icon('globe') + '<a href="' + esc(site) + '" target="_blank" rel="noopener">' +
            esc(c.websiteLabel || site.replace(/^https?:\/\//,'')) + '</a></div>' : '') +
  '</div></div>';

  document.getElementById('panel-about').innerHTML =
    '<div class="sectitle">' + esc(u('education')) + '</div><div class="grid two">' + edu + '</div>' +
    '<div class="sectitle">' + esc(u('expertise')) + '</div><div class="grid three">' + exp + '</div>' +
    '<div class="sectitle">' + esc(u('contact'))   + '</div>' + contact;

function renderWork(P){

  }).join('') || emptyCard();

/* ============================================================
 *  AUTH
 * ============================================================ */
function lockClick(){ if (TOKEN) openEditor(); else openLogin(); }

function openLogin(){
  document.getElementById('loginErr').textContent = '';
  document.getElementById('codeInput').value = '';
  document.getElementById('loginMask').classList.remove('hide');
  setTimeout(function(){ document.getElementById('codeInput').focus(); }, 60);
}
function closeLogin(){ document.getElementById('loginMask').classList.add('hide'); }

function doLogin(){
  var code = document.getElementById('codeInput').value;
  var btn  = document.getElementById('loginBtn');
  var err  = document.getElementById('loginErr');
  btn.disabled = true; err.textContent = 'กำลังตรวจสอบ...';

  google.script.run
    .withSuccessHandler(function(res){
      btn.disabled = false;
      if (res && res.ok){
        TOKEN = res.token;
        closeLogin();
        openEditor();
        renderView();
      } else {
        err.textContent = (res && res.msg) || 'รหัสไม่ถูกต้อง';
        document.getElementById('codeInput').select();
      }
    })
    .withFailureHandler(function(e){
      btn.disabled = false;
      err.textContent = 'เกิดข้อผิดพลาด: ' + e.message;
    })
    .login(code);
}

function doLogout(){
  if (DIRTY && !confirm('ยังมีการแก้ไขที่ไม่ได้บันทึก ต้องการออกจากระบบหรือไม่?')) return;
  google.script.run.logout(TOKEN);
  TOKEN = null; DRAFT = null; DIRTY = false;
  document.getElementById('editor').classList.add('hide');
  renderView();
  toast('ออกจากโหมดแก้ไขแล้ว');
}

/* ---------- ตัวสร้างฟิลด์ ---------- */
function inputHtml(path, val, area, ph){
  var v = esc(val);
  return area
    ? '<textarea data-p="' + esc(path) + '" placeholder="' + esc(ph || '') + '">' + v + '</textarea>'
    : '<input type="text" data-p="' + esc(path) + '" value="' + v + '" placeholder="' + esc(ph || '') + '">';
}
function fText(path, label, area, ph){
  return '<div class="fld"><label class="fl">' + esc(label) + '</label>' +
         inputHtml(path, getP(DRAFT, path), area, ph) + '</div>';
}
/* สตริงเดี่ยวของเดิม → แยกเป็นรายภาษาตามอักษรที่ใช้ */
function toBi(v){
  if (v !== null && typeof v === 'object') return v;
  var s = String(v == null ? '' : v);
  if (/[฀-๿]/.test(s)) return { th:s, en:'', mon:'' };
  if (/[က-႟]/.test(s)) return { th:'', en:'', mon:s };
  return { th:'', en:s, mon:'' };
}
function triInputs(path, cur, area){
  return '<div class="fld tri" style="margin:0">' + LANGS.map(function(l){
    return '<div><span class="lg">' + esc(l.n) + '</span>' +
      inputHtml(path + '.' + l.k, cur[l.k] || '', area, l.n) + '</div>';
  }).join('') + '</div>';
}
/** ฟิลด์ ๓ ภาษา (ไทย / อังกฤษ / มอญ) — ค่าสตริงเดิมถูกแปลงเป็นรายภาษาเมื่อเปิดแก้ */
function fBi(path, label, area){
  var cur = getP(DRAFT, path);
  if (cur === null || typeof cur !== 'object'){
    cur = toBi(cur);
    setP(DRAFT, path, cur);
  }
  return '<div class="fld"><label class="fl">' + esc(label) + '</label>' + triInputs(path, cur, area) + '</div>';
}
function fIcon(path, label){
  var cur = getP(DRAFT, path);
  var opts = Object.keys(ICONS).map(function(k){
    return '<option value="' + k + '"' + (k === cur ? ' selected' : '') + '>' + k + '</option>';
  }).join('');
  return '<div class="fld"><label class="fl">' + esc(label) + '</label>' +
    '<div class="row"><span class="badge" style="padding:6px">' + icon(cur) + '</span>' +
    '<select data-p="' + esc(path) + '" style="flex:1">' + opts + '</select></div></div>';
}
function fImg(path, label){
  var cur = getP(DRAFT, path);
  var uid = 'f_' + path.replace(/\W/g,'_');
  return '<div class="fld"><label class="fl">' + esc(label) + '</label>' +
    inputHtml(path, cur, false, 'วางลิงก์รูป https://...') +
    '<div class="thumbrow">' +
      '<img src="' + esc(urlOf(cur)) + '" alt="" onerror="this.style.visibility=\'hidden\'" onload="this.style.visibility=\'visible\'">' +
      '<input type="file" id="' + uid + '" accept="image/*" class="hide" onchange="pickImage(this,\'' + esc(path) + '\')">' +
      '<button class="btn ghost" type="button" onclick="document.getElementById(\'' + uid + '\').click()">อัปโหลดรูป</button>' +
      (cur ? '<button class="btn ghost" type="button" onclick="clearField(\'' + esc(path) + '\')">ลบรูป</button>' : '') +
    '</div></div>';
}
function fColor(path, label){
  var cur = getP(DRAFT, path) || '#000000';
  var id  = 'c_' + path.replace(/\W/g,'_');
  return '<div class="fld"><label class="fl">' + esc(label) + '</label><div class="row">' +
    '<input type="color" id="' + id + '" data-p="' + esc(path) + '" data-mirror="' + id + '_t" value="' + esc(cur) + '">' +
    '<input type="text" id="' + id + '_t" data-p="' + esc(path) + '" data-mirror="' + id + '" value="' + esc(cur) + '" style="flex:1">' +
    '</div></div>';
}
function fRange(path, label, min, max, step){
  var cur = getP(DRAFT, path);
  return '<div class="fld"><label class="fl">' + esc(label) + ' (' + esc(cur) + ')</label>' +
    '<input type="range" data-p="' + esc(path) + '" data-num="1" data-relabel="1" min="' + min + '" max="' + max + '" step="' + step + '" value="' + esc(cur) + '" style="width:100%">' +
    '</div>';
}
function fSelect(path, label, opts){
  var cur = getP(DRAFT, path);
  var o = opts.map(function(x){
    var v = x.v !== undefined ? x.v : x, n = x.n !== undefined ? x.n : x;
    return '<option value="' + esc(v) + '"' + (String(v) === String(cur) ? ' selected' : '') + '>' + esc(n) + '</option>';
  }).join('');
  return '<div class="fld"><label class="fl">' + esc(label) + '</label><select data-p="' + esc(path) + '">' + o + '</select></div>';
}
function fCheck(path, label){
  var cur = !!getP(DRAFT, path);
  return '<div class="fld"><label class="row" style="cursor:pointer">' +
    '<input type="checkbox" data-p="' + esc(path) + '"' + (cur ? ' checked' : '') + ' style="width:auto">' +
    '<span style="font-size:14px">' + esc(label) + '</span></label></div>';
}

/* ---------- การผูกค่าจากฟอร์ม ---------- */
document.getElementById('edMain').addEventListener('input', onField);
document.getElementById('edMain').addEventListener('change', onField);

function onField(ev){
  var el = ev.target, path = el.getAttribute && el.getAttribute('data-p');
  if (!path) return;

  var val;
  if (el.type === 'checkbox') val = el.checked;
  else if (el.getAttribute('data-num')) val = Number(el.value);
  else val = el.value;

  setP(DRAFT, path, val);

  var mirror = el.getAttribute('data-mirror');
  if (mirror){
    var m = document.getElementById(mirror);
    if (m && m.value !== el.value) m.value = el.value;
  }
  if (el.getAttribute('data-relabel')){
    var lab = el.parentNode.querySelector('label.fl');
    if (lab) lab.textContent = lab.textContent.replace(/\s*\(.*\)$/, '') + ' (' + el.value + ')';
  }
  markDirty(true);
  schedulePreview();
}

function schedulePreview(){
  clearTimeout(previewTimer);
  previewTimer = setTimeout(renderView, 220);
}
function markDirty(v){
  DIRTY = v;
  document.getElementById('dirtyFlag').textContent = v ? '● มีการแก้ไขที่ยังไม่บันทึก' : '';
}

/* ---------- จัดการรายการในลิสต์ ---------- */
function addItem(key){
  DRAFT[key] = DRAFT[key] || [];
  DRAFT[key].push(LISTS[key].blank());
  markDirty(true); renderEditor(); renderView();
  var main = document.getElementById('edMain');
  main.scrollTop = main.scrollHeight;
}
function delItem(key, i){
  if (!confirm('ลบรายการนี้?')) return;
  DRAFT[key].splice(i, 1);
  markDirty(true); renderEditor(); renderView();
}
function dupItem(key, i){
  DRAFT[key].splice(i + 1, 0, clone(DRAFT[key][i]));
  markDirty(true); renderEditor(); renderView();
}
function moveItem(key, i, d){
  var a = DRAFT[key], j = i + d;
  if (j < 0 || j >= a.length) return;
  var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  markDirty(true); renderEditor(); renderView();
}
function clearField(path){
  setP(DRAFT, path, '');
  markDirty(true); renderEditor(); renderView();
}
function resetUiText(){
  if (!confirm('คืนค่าข้อความหน้าเว็บทั้งหมดเป็นค่าเริ่มต้น?')) return;
  delete DRAFT.ui;
  markDirty(true); renderEditor(); renderView();
}
function resetTheme(){
  if (!confirm('คืนค่าธีมเป็นค่าเริ่มต้น?')) return;
  DRAFT.theme = { mode:'auto', accent:'#c8952f', useCustom:false, bg:'#faf7f1', card:'#ffffff',
                  ink:'#221a10', muted:'#6b6152', line:'#e8e0d2', font:'Sarabun',
                  radius:14, coverHeight:220, coverOpacity:0.55 };
  markDirty(true); renderEditor(); renderView();
}

/* ---------- อัปโหลดรูป ---------- */
function pickImage(input, path){
  var f = input.files && input.files[0];
  if (!f) return;
  if (f.size > 8 * 1024 * 1024){ toast('ไฟล์ใหญ่เกิน 8MB', true); input.value = ''; return; }

  toast('กำลังอัปโหลด...');
  var fr = new FileReader();
  fr.onload = function(){
    google.script.run
      .withSuccessHandler(function(res){
        setP(DRAFT, path, res.url);
        markDirty(true); renderEditor(); renderView();
        toast('อัปโหลดรูปเรียบร้อย');
      })
      .withFailureHandler(function(e){ toast('อัปโหลดไม่สำเร็จ: ' + e.message, true); })
      .uploadImage(TOKEN, fr.result, f.name);
  };
  fr.onerror = function(){ toast('อ่านไฟล์ไม่สำเร็จ', true); };
  fr.readAsDataURL(f);
}

/* ---------- บันทึก / คำสั่งอื่น ---------- */
function saveAll(){
  if (!TOKEN){ toast('เซสชันหมดอายุ กรุณาใส่รหัสใหม่', true); openLogin(); return; }
  var btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';

  google.script.run
    .withSuccessHandler(function(res){
      btn.disabled = false; btn.textContent = 'บันทึก';
      PROFILE = res.data;
      DRAFT = clone(PROFILE);
      markDirty(false);
      renderView(); renderEditor();
      toast(res.msg || 'บันทึกเรียบร้อย');
    })
    .withFailureHandler(function(e){
      btn.disabled = false; btn.textContent = 'บันทึก';
      toast('บันทึกไม่สำเร็จ: ' + e.message, true);
    })
    .saveProfile(TOKEN, JSON.stringify(DRAFT));
}

function doChangeCode(){
  var o = document.getElementById('pw_old').value;
  var n = document.getElementById('pw_new').value;
  var n2 = document.getElementById('pw_new2').value;
  if (n !== n2){ toast('รหัสใหม่ทั้งสองช่องไม่ตรงกัน', true); return; }

  google.script.run
    .withSuccessHandler(function(res){
      toast(res.msg, !res.ok);
      if (res.ok){ document.getElementById('pw_old').value = ''; document.getElementById('pw_new').value = ''; document.getElementById('pw_new2').value = ''; }
    })
    .withFailureHandler(function(e){ toast(e.message, true); })
    .changeCode(TOKEN, o, n);
}

function doRestore(){
  if (!confirm('ย้อนกลับไปข้อมูลเวอร์ชันก่อนหน้า? การแก้ไขที่ยังไม่บันทึกจะหายไป')) return;
  google.script.run
    .withSuccessHandler(function(res){
      if (res.ok){ PROFILE = res.data; DRAFT = clone(PROFILE); markDirty(false); renderView(); renderEditor(); }
      toast(res.msg, !res.ok);
    })
    .withFailureHandler(function(e){ toast(e.message, true); })
    .restoreBackup(TOKEN);
}

function doReset(){
  if (!confirm('คืนค่าเริ่มต้นทั้งหมด?\nข้อมูลที่แก้ไขไว้จะถูกแทนที่ด้วยค่าตั้งต้นใน Code.gs\n(ยังกด “ย้อนกลับ” ได้ 1 ครั้ง)')) return;
  google.script.run
    .withSuccessHandler(function(res){
      PROFILE = res.data; DRAFT = clone(PROFILE); markDirty(false); renderView(); renderEditor();
      toast(res.msg);
    })
    .withFailureHandler(function(e){ toast(e.message, true); })
    .resetProfile(TOKEN);
}

function copyJson(){
  var ta = document.getElementById('jsonBox');
  ta.select();
  try { document.execCommand('copy'); toast('คัดลอกแล้ว'); }
  catch (e){ toast('คัดลอกไม่สำเร็จ กด Ctrl+C แทน', true); }
}
function downloadJson(){
  try{
    var blob = new Blob([JSON.stringify(DRAFT, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'profile-backup.json';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
  } catch (e){ toast('ดาวน์โหลดไม่ได้ ให้ใช้ปุ่มคัดลอกแทน', true); }
}
function importJson(){
  var raw = document.getElementById('jsonBox').value;
  var obj;
  try { obj = JSON.parse(raw); }
  catch (e){ toast('JSON ไม่ถูกต้อง: ' + e.message, true); return; }
  if (!obj || !obj.name){ toast('ข้อมูลไม่สมบูรณ์ (ไม่พบฟิลด์ name)', true); return; }
  if (!confirm('แทนที่ข้อมูลที่กำลังแก้ไขด้วย JSON นี้?')) return;
  DRAFT = obj;
  markDirty(true); renderEditor(); renderView();
  toast('นำเข้าแล้ว — อย่าลืมกดบันทึก');
}

/* ============================================================
 *  START
 * ============================================================ */
renderView();
if (AUTO_EDIT) openLogin();
</script>
</body>
